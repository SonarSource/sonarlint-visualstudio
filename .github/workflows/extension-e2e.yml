name: Extension E2E test

on:
  workflow_call:
    inputs:
      project-version:
        description: Four-part version of the build, as published to repox
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  extension-e2e:
    name: Extension E2E (VS 18)
    runs-on: warp-custom-sonarlint-visualstudio
    timeout-minutes: 20
    env:
      E2E_EXPECTED_VS_VERSION: '18.12.12405.243'
      E2E_EXPECTED_VS_PRODUCT: Microsoft.VisualStudio.Product.Community
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read repox URL and artifact credentials
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/kv/data/repox url | ARTIFACTORY_URL;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USER;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;

      # The build publishes its signed binaries to repox before this job starts.
      - name: Download this build's signed VSIX from repox
        shell: powershell
        env:
          PROJECT_VERSION: ${{ inputs.project-version }}
          ARTIFACTORY_URL: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_URL }}
          ARTIFACTORY_USER: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USER }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          # Windows PowerShell's progress bar slows large downloads down considerably.
          $ProgressPreference = 'SilentlyContinue'
          if ($env:PROJECT_VERSION -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "Unexpected project version '$env:PROJECT_VERSION'." }
          $name = "SonarLint.VSIX-$env:PROJECT_VERSION-2022.vsix"
          $url = "$($env:ARTIFACTORY_URL.TrimEnd('/'))/sonarsource-public-qa/org/sonarsource/sonarlint/visualstudio/sonarlint-visualstudio/$env:PROJECT_VERSION/$name"
          $directory = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'extension-e2e-package')
          $authorization = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("${env:ARTIFACTORY_USER}:${env:ARTIFACTORY_ACCESS_TOKEN}"))
          Invoke-WebRequest -UseBasicParsing -TimeoutSec 600 -Uri $url -Headers @{ Authorization = "Basic $authorization" } -OutFile (Join-Path $directory $name)

      - name: Build C# E2E tests
        shell: powershell
        env:
          ARTIFACTORY_USER: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USER }}
          ARTIFACTORY_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $expectedVersion = [version]$env:E2E_EXPECTED_VS_VERSION
          $versionRange = "[$($expectedVersion.Major).$($expectedVersion.Minor),$($expectedVersion.Major).$($expectedVersion.Minor + 1))"
          $idePath = & $vswhere -latest -products $env:E2E_EXPECTED_VS_PRODUCT -version $versionRange -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $idePath) { throw 'Full Visual Studio not found.' }
          dotnet build tests/e2e/Extension.E2E.Tests.csproj -c Release -p:VsTargetVersion=2022 "-p:VisualStudioInstallPath=$idePath" -p:RestoreLockedMode=true
          if ($LASTEXITCODE -ne 0) { throw 'C# E2E test build failed.' }

      - name: Exercise one fresh installation
        shell: powershell
        run: |
          $packages = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'extension-e2e-package') -Filter 'SonarLint.VSIX-*-2022.vsix' -File)
          if ($packages.Count -ne 1) { throw "Expected exactly one VSIX from this build; found $($packages.Count)." }
          $results = Join-Path $env:RUNNER_TEMP 'extension-e2e/run-1'
          $env:E2E_VSIX_PATH = $packages[0].FullName
          $env:E2E_RESULTS_DIRECTORY = Join-Path $results 'evidence'
          dotnet test tests/e2e/Extension.E2E.Tests.csproj -c Release --no-build --no-restore --filter TestCategory=ExtensionE2E --logger 'trx;LogFileName=e2e.trx' --results-directory $results -p:VsTargetVersion=2022 -- RunConfiguration.TreatNoTestsAsError=true
          if ($LASTEXITCODE -ne 0) { throw 'Extension E2E test failed.' }

      - name: Upload E2E test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-e2e-vs${{ env.E2E_EXPECTED_VS_VERSION }}
          path: ${{ runner.temp }}/extension-e2e/
          if-no-files-found: warn
          retention-days: 7
