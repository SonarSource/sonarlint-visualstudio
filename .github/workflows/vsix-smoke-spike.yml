name: VSIX smoke feasibility (SLVS-3097)

on:
  workflow_call:
    inputs:
      project-version:
        required: true
        type: string
      earliest-runner:
        required: true
        type: string
      latest-runner:
        required: true
        type: string
      repetitions:
        default: '3'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      project-version:
        description: Promoted build version, for example 11.1.0.17360
        required: true
        type: string
      earliest-runner:
        description: Exact DEV runner label emitted by the VS 2022 minimum image PR
        required: true
        type: string
      latest-runner:
        description: Exact DEV runner label emitted by the latest VS 18 image PR
        required: true
        type: string
      repetitions:
        description: Fresh installations to exercise (1-5)
        default: '3'
        required: true
        type: choice
        options: ['1', '2', '3', '4', '5']

permissions:
  contents: read
  id-token: write

jobs:
  configure:
    runs-on: sonar-xs
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Validate candidate runners and define version matrix
        id: targets
        shell: bash
        env:
          EARLIEST_RUNNER: ${{ inputs.earliest-runner }}
          LATEST_RUNNER: ${{ inputs.latest-runner }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          targets = [
              {"name": "earliest-vs2022-17.0", "runner": os.environ["EARLIEST_RUNNER"], "version": "17.0.31903.59"},
              {"name": "latest-vs18", "runner": os.environ["LATEST_RUNNER"], "version": "18.11.12328.437"},
          ]
          for target in targets:
              if not re.fullmatch(r"warp-custom-pr-\d+-sonarlint-visualstudio(?:-vs2022-min)?-v\d{14}", target["runner"]):
                  raise SystemExit("Supply the actual DEV runner labels from the two image workflow outputs.")
          if targets[0]["runner"] == targets[1]["runner"]:
              raise SystemExit("Earliest and latest must use distinct image runners.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("targets=" + json.dumps({"include": targets}) + "\n")
          PYTHON

  smoke:
    name: Smoke (${{ matrix.name }})
    needs: configure
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate requested build
        shell: powershell
        env:
          PROJECT_VERSION: ${{ inputs.project-version }}
        run: |
          if ($env:PROJECT_VERSION -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw 'Expected a four-part numeric build version.'
          }

      - name: Read artifact credentials
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/kv/data/repox url | ARTIFACTORY_URL;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USER;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;

      - name: Download the built VSIX
        shell: powershell
        env:
          PROJECT_VERSION: ${{ inputs.project-version }}
          ARTIFACTORY_URL: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_URL }}
          ARTIFACTORY_USER: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USER }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $authorization = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("${env:ARTIFACTORY_USER}:${env:ARTIFACTORY_ACCESS_TOKEN}"))
          $name = "SonarLint.VSIX-${env:PROJECT_VERSION}-2022.vsix"
          $url = "$($env:ARTIFACTORY_URL.TrimEnd('/'))/sonarsource-public-builds/org/sonarsource/sonarlint/visualstudio/sonarlint-visualstudio/${env:PROJECT_VERSION}/$name"
          Invoke-WebRequest -UseBasicParsing -TimeoutSec 180 -Uri $url -Headers @{ Authorization = "Basic $authorization" } -OutFile (Join-Path $env:RUNNER_TEMP 'candidate.vsix')

      - name: Build C# smoke tests
        shell: powershell
        env:
          ARTIFACTORY_USER: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USER }}
          ARTIFACTORY_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $idePath = & $vswhere -latest -products Microsoft.VisualStudio.Product.Community -version '[17.0,19.0)' -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $idePath) { throw 'Full Visual Studio not found.' }
          dotnet build tests/smoke/VsixSmoke.Tests.csproj -c Release -p:VsTargetVersion=2022 "-p:VisualStudioInstallPath=$idePath" -p:RestoreLockedMode=true
          if ($LASTEXITCODE -ne 0) { throw 'C# smoke-test build failed.' }

      - name: Exercise independent installations
        shell: powershell
        env:
          REPETITIONS: ${{ inputs.repetitions }}
          SMOKE_EXPECTED_VS_VERSION: ${{ matrix.version }}
          SMOKE_EXPECTED_VS_PRODUCT: Microsoft.VisualStudio.Product.Community
        run: |
          $failedRuns = @()
          for ($iteration = 1; $iteration -le [int]$env:REPETITIONS; $iteration++) {
            $results = Join-Path $env:RUNNER_TEMP "slvs3097/run-$iteration"
            $env:SMOKE_VSIX_PATH = Join-Path $env:RUNNER_TEMP 'candidate.vsix'
            $env:SMOKE_RESULTS_DIRECTORY = Join-Path $results 'evidence'
            dotnet test tests/smoke/VsixSmoke.Tests.csproj -c Release --no-build --no-restore --logger 'trx;LogFileName=smoke.trx' --results-directory $results -p:VsTargetVersion=2022
            if ($LASTEXITCODE -ne 0) { $failedRuns += $iteration }
          }
          if ($failedRuns.Count -gt 0) { throw "Smoke runs failed: $($failedRuns -join ', ')" }

      - name: Upload feasibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slvs3097-vsix-smoke-${{ matrix.name }}
          path: ${{ runner.temp }}/slvs3097/
          if-no-files-found: warn
          retention-days: 7
