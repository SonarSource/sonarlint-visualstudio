name: VSIX smoke with Roslyn harness (SLVS-3097)

on:
  workflow_call:
    inputs:
      project-version:
        required: true
        type: string
      runner-label:
        required: true
        type: string
      repetitions:
        default: '3'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      project-version:
        description: Promoted build version, for example 11.1.0.17360
        required: true
        type: string
      runner-label:
        description: Exact VS 18 DEV runner label emitted by image PR 513
        required: true
        type: string
      repetitions:
        description: Fresh installations to exercise (1-5)
        default: '3'
        required: true
        type: choice
        options: ['1', '2', '3', '4', '5']

permissions:
  contents: read
  id-token: write

jobs:
  validate-runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.runner.outputs.label }}
    steps:
      - id: runner
        shell: bash
        env:
          RUNNER_LABEL: ${{ inputs.runner-label }}
        run: |
          if [[ ! "$RUNNER_LABEL" =~ ^warp-custom-pr-513-sonarlint-visualstudio-v[0-9]{14}$ ]]; then
            echo '::error::Supply the exact DEV runner label from image PR 513.'
            exit 1
          fi
          echo "label=$RUNNER_LABEL" >> "$GITHUB_OUTPUT"

  smoke:
    needs: validate-runner
    runs-on: ${{ needs.validate-runner.outputs.label }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate requested build
        shell: powershell
        env:
          PROJECT_VERSION: ${{ inputs.project-version }}
        run: |
          if ($env:PROJECT_VERSION -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw 'Expected a four-part numeric build version.'
          }

      - name: Read artifact credentials
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/kv/data/repox url | ARTIFACTORY_URL;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USER;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;

      - name: Download the built VSIX
        shell: powershell
        env:
          PROJECT_VERSION: ${{ inputs.project-version }}
          ARTIFACTORY_URL: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_URL }}
          ARTIFACTORY_USER: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USER }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $authorization = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("${env:ARTIFACTORY_USER}:${env:ARTIFACTORY_ACCESS_TOKEN}"))
          $name = "SonarLint.VSIX-${env:PROJECT_VERSION}-2022.vsix"
          $url = "$($env:ARTIFACTORY_URL.TrimEnd('/'))/sonarsource-public-builds/org/sonarsource/sonarlint/visualstudio/sonarlint-visualstudio/${env:PROJECT_VERSION}/$name"
          Invoke-WebRequest -UseBasicParsing -TimeoutSec 180 -Uri $url -Headers @{ Authorization = "Basic $authorization" } -OutFile (Join-Path $env:RUNNER_TEMP 'candidate.vsix')

      - name: Restore signed test dependencies
        shell: powershell
        working-directory: tests/smoke
        env:
          ARTIFACTORY_USER: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USER }}
          ARTIFACTORY_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          dotnet restore VsixSmoke.Tests.csproj --locked-mode -p:VsTargetVersion=2022
          if ($LASTEXITCODE -ne 0) { throw 'Smoke dependency restore failed.' }

      - name: Exercise independent installations through Roslyn
        shell: powershell
        working-directory: tests/smoke
        env:
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $idePath = & $vswhere -latest -products Microsoft.VisualStudio.Product.Professional -version '[18.0,19.0)' -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $idePath) { throw 'Full Visual Studio 18 not found.' }
          $env:VSInstallDir = $idePath
          $candidate = Join-Path $env:RUNNER_TEMP 'candidate.vsix'
          $candidateHash = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash
          $failedRuns = @()
          for ($iteration = 1; $iteration -le [int]$env:REPETITIONS; $iteration++) {
            $results = Join-Path $env:RUNNER_TEMP "slvs3097/run-$iteration"
            $suffix = 'SLVS3097' + [guid]::NewGuid().ToString('N').Substring(0, 12)
            $env:SMOKE_RESULTS_DIRECTORY = Join-Path $results 'evidence'
            $env:XUNIT_LOGS = Join-Path $results 'harness'
            dotnet build VsixSmoke.Tests.csproj -c Release --no-restore -p:VsTargetVersion=2022 "-p:VisualStudioInstallPath=$idePath" "-p:SmokeVsixPath=$candidate" "-p:SmokeRootSuffix=$suffix"
            if ($LASTEXITCODE -ne 0) { throw 'Smoke-test compilation failed.' }
            dotnet test VsixSmoke.Tests.csproj -c Release --no-build --no-restore --settings test.runsettings --filter 'FullyQualifiedName~InstalledExtension_DetectsIssue_AndClearsItAfterFix' --logger 'trx;LogFileName=smoke.trx' --results-directory $results -p:VsTargetVersion=2022
            $failed = $LASTEXITCODE -ne 0
            try {
              [xml]$trx = Get-Content -LiteralPath (Join-Path $results 'smoke.trx') -Raw -ErrorAction Stop
              $cases = @($trx.SelectNodes("//*[local-name()='UnitTestResult' and contains(@testName, 'InstalledExtension_DetectsIssue_AndClearsItAfterFix')]"))
              if ($cases.Count -ne 1 -or $cases[0].outcome -ne 'Passed') { throw 'The actual smoke scenario must execute and pass; skipped/missing cases fail.' }
              $report = Get-Content -LiteralPath (Join-Path $env:SMOKE_RESULTS_DIRECTORY 'result.json') -Raw -ErrorAction Stop | ConvertFrom-Json
              if ($report.status -ne 'passed' -or $report.phase -ne 'complete' -or $report.rootSuffix -ne $suffix -or $report.vsixSha256 -ne $candidateHash) { throw 'Missing or inconsistent smoke evidence.' }
            }
            catch { Write-Warning $_.Exception.Message; $failed = $true }
            if ($failed) { $failedRuns += $iteration }
          }
          if ($failedRuns.Count -gt 0) { throw "Smoke runs failed: $($failedRuns -join ', ')" }

      - name: Upload feasibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slvs3097-roslyn-vsix-smoke
          path: ${{ runner.temp }}/slvs3097/
          if-no-files-found: warn
          retention-days: 7
