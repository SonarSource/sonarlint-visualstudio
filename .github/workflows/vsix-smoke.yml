name: Installed VSIX smoke tests

on:
  workflow_call:

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  smoke:
    name: Smoke (VS 18.11)
    runs-on: warp-custom-pr-513-sonarlint-visualstudio-v20261109151945
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download this build's signed binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: ${{ runner.temp }}/vsix-smoke-package

      - name: Read artifact credentials for NuGet restore
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USER;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;

      - name: Build C# smoke tests
        shell: powershell
        env:
          ARTIFACTORY_USER: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USER }}
          ARTIFACTORY_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $idePath = & $vswhere -latest -products Microsoft.VisualStudio.Product.Community -version '[18.11,18.12)' -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $idePath) { throw 'Full Visual Studio not found.' }
          dotnet build tests/smoke/VsixSmoke.Tests.csproj -c Release -p:VsTargetVersion=2022 "-p:VisualStudioInstallPath=$idePath" -p:RestoreLockedMode=true
          if ($LASTEXITCODE -ne 0) { throw 'C# smoke-test build failed.' }

      - name: Exercise one fresh installation
        shell: powershell
        env:
          SMOKE_EXPECTED_VS_VERSION: '18.11.12328.437'
          SMOKE_EXPECTED_VS_PRODUCT: Microsoft.VisualStudio.Product.Community
        run: |
          $packages = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'vsix-smoke-package') -Filter 'SonarLint.VSIX-*-2022.vsix' -File)
          if ($packages.Count -ne 1) { throw "Expected exactly one VSIX from this build; found $($packages.Count)." }
          $results = Join-Path $env:RUNNER_TEMP 'vsix-smoke/run-1'
          $env:SMOKE_VSIX_PATH = $packages[0].FullName
          $env:SMOKE_RESULTS_DIRECTORY = Join-Path $results 'evidence'
          dotnet test tests/smoke/VsixSmoke.Tests.csproj -c Release --no-build --no-restore --filter TestCategory=InstalledVsixSmoke --logger 'trx;LogFileName=smoke.trx' --results-directory $results -p:VsTargetVersion=2022
          if ($LASTEXITCODE -ne 0) { throw 'Installed VSIX smoke test failed.' }

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsix-smoke-vs18.11
          path: ${{ runner.temp }}/vsix-smoke/
          if-no-files-found: warn
          retention-days: 7
